services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaizen_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=kaizen_board;Username=postgres;Password=postgres
      Jwt__Key: KaizenBoardSuperSecretKeyForJwtSigning2026!
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_USE_MOCK: "false"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pg_data:
